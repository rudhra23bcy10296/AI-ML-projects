<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Deployment Dashboard - Rudhra Sitholey</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 32px; width: 100%; max-width: 540px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; text-align: center; }
        .badge { background: #0284c7; color: white; padding: 4px 12px; border-radius: 9999px; font-size: 12px; display: inline-block; margin-bottom: 24px; text-align: center; }
        .student-info { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 24px; line-height: 1.5; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .result { margin-top: 24px; padding: 16px; border-radius: 8px; background: #090d16; border: 1px solid #1e293b; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Render ML Inference Web App</h1>
        <div style="text-align: center;"><span class="badge">Render Cloud Production Ready</span></div>
        <div class="student-info">
            <strong>Student:</strong> {{ student_name }} | <strong>Reg No:</strong> {{ reg_no }} | <strong>App No:</strong> {{ app_no }}
        </div>
        
        <form id="predictionForm">
            <div class="form-group">
                <label>Feature 1 (Income / Metric A):</label>
                <input type="number" step="0.01" id="f1" value="1.25" required>
            </div>
            <div class="form-group">
                <label>Feature 2 (Score / Metric B):</label>
                <input type="number" step="0.01" id="f2" value="0.85" required>
            </div>
            <div class="form-group">
                <label>Feature 3 (Ratio / Metric C):</label>
                <input type="number" step="0.01" id="f3" value="-0.42" required>
            </div>
            <div class="form-group">
                <label>Feature 4 (Index / Metric D):</label>
                <input type="number" step="0.01" id="f4" value="2.10" required>
            </div>
            <button type="submit">Predict Online Inference</button>
        </form>
        
        <div id="resultBox" class="result">
            <h3 style="color: #38bdf8; margin-top:0;">Inference Result:</h3>
            <p><strong>Predicted Class:</strong> <span id="resClass" style="color: #4ade80;">-</span></p>
            <p><strong>Class Probabilities:</strong> <span id="resProba">-</span></p>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                feature1: parseFloat(document.getElementById('f1').value),
                feature2: parseFloat(document.getElementById('f2').value),
                feature3: parseFloat(document.getElementById('f3').value),
                feature4: parseFloat(document.getElementById('f4').value)
            };
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('resClass').innerText = data.class_label;
            document.getElementById('resProba').innerText = JSON.stringify(data.probabilities);
        });
    </script>
</body>
</html>
